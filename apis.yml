name: Cerexa
description: >-
  Cerexa was a privately held biopharmaceutical company founded in the mid-2000s (its cerexa.com
  domain was registered in March 2005) to develop anti-infective therapies for serious, drug-resistant
  bacterial infections in the hospital setting. Its lead program was ceftaroline fosamil, a
  fifth-generation cephalosporin antibiotic active against methicillin-resistant Staphylococcus aureus
  (MRSA), in-licensed from Takeda Pharmaceutical Company and carried forward by Forest Laboratories;
  the compound was approved by the FDA on October 29, 2010 and marketed as Teflaro in the United States
  and Zinforo in Europe. Cerexa was backed by venture investors including Canaan Partners, and its
  programs ultimately passed through Forest Laboratories into the Actavis/Allergan combination (Forest
  Laboratories was acquired by Actavis on July 1, 2014) and on to AbbVie. Cerexa no longer operates as
  an independent company and has no developer surface: it publishes no API, no SDKs, no GitHub
  organization and no documentation, and its historical cerexa.com domain is now registered and
  operated by AbbVie, 301-redirecting to AbbVie's Allergan page. This profile is retained as a
  historical company record in the API Evangelist network.
